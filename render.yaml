# MathGenius Render Deployment Configuration (Backup Option)
# Use this if Nobus deployment has issues

services:
  # Backend API Service
  - type: web
    name: mathgenius-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: 100
      - key: ALLOWED_ORIGINS
        value: https://mathgenius.guru,https://www.mathgenius.guru
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: mathgenius.guru
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: noreply@mathgenius.guru
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_REPLY_TO
        value: help@mathgenius.guru
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_EMAIL
        value: help@mathgenius.guru
      - key: SMTP_REPLY_TO
        value: help@mathgenius.guru
      - key: FRONTEND_URL
        value: https://mathgenius.guru
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: mathgenius-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        value: https://api.mathgenius.guru
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

